name: release

# Etiqueta -> binarios + configurador de un solo fichero, adjuntos a la release.
# El .exe y el binario de Linux salen de aquí, así que no hace falta que nadie
# los compile: se descargan de la página de releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # sólo compila y deja los artefactos, sin release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux x86_64 - glibc 2.31, Debian 11+ / Ubuntu 20.04+
        run: |
          # se compila dentro de bullseye para que el binario no exija una glibc
          # más nueva que la del runner
          docker run --rm -v "$PWD:/w" -w /w/native rust:1-slim-bullseye \
            cargo build --release --offline
          sudo chown -R "$(id -u):$(id -g)" native/target
          install -m 755 native/target/release/s700-host s700-host-linux-x86_64

      - name: Windows x86_64 - PE32+, mingw
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu
          cargo build --release --offline \
            --manifest-path native/Cargo.toml --target x86_64-pc-windows-gnu
          cp native/target/x86_64-pc-windows-gnu/release/s700-host.exe s700-host-windows-x86_64.exe

      - name: Configurador de un solo fichero
        run: |
          make build
          cp dist/S700-configurador.html S700-configurator.html

      - name: Pruebas
        run: make test

      - name: Artefactos (siempre, también sin etiqueta)
        uses: actions/upload-artifact@v4
        with:
          name: s700-host
          path: |
            s700-host-linux-x86_64
            s700-host-windows-x86_64.exe
            S700-configurator.html
            native/99-s700-hid.rules

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Configurator for the HXSJ S700 «G6» gaming mouse — download, run, done. Nothing to install.

            * `s700-host-windows-x86_64.exe` — Windows 10/11: double click and that is it. It opens
              your browser with the interface already loaded and talks to the mouse itself; there
              are no permissions to grant and no address to type (`--no-open` if you would rather
              open it yourself; it listens on <http://127.0.0.1:8760/>).
            * `s700-host-linux-x86_64` — Linux x86_64: run it, same interface. Before the first
              run, once, the kernel node permission:
              `sudo cp 99-s700-hid.rules /etc/udev/rules.d/ && sudo udevadm control --reload-rules && sudo udevadm trigger`
            * `S700-configurator.html` — one file, if you would rather not run anything: open it in
              Chrome/Edge/Brave and press *Connect mouse* (WebHID).
            * `99-s700-hid.rules` — the `/dev/hidraw*` permission rule for Linux.

            Or use the served version: <https://jo3l.github.io/s700-mouse-configurator/>

            Back up from the *Backup* tab before writing anything to the mouse.
          files: |
            s700-host-linux-x86_64
            s700-host-windows-x86_64.exe
            S700-configurator.html
            native/99-s700-hid.rules
