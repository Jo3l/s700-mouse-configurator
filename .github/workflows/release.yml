name: release

# Etiqueta -> binarios + configurador de un solo fichero, adjuntos a la release.
# El .exe y el binario de Linux salen de aquí, así que no hace falta que nadie
# los compile: se descargan de la página de releases.
#
# Desde que la ventana es un WebView del sistema (wry): Linux enlaza WebKitGTK
# 4.1 y Windows enlaza WebView2, que sólo existe para MSVC — de ahí que el .exe
# se compile en un runner Windows y no con mingw.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # sólo compila y deja los artefactos, sin release

permissions:
  contents: write

jobs:
  linux:
    # Ubuntu 22.04 (glibc 2.35) + libwebkit2gtk-4.1-dev: el binario resultante
    # pide libwebkit2gtk-4.1-0 y libgtk-3-0 en la máquina donde se ejecute.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux x86_64 - WebKitGTK 4.1, glibc 2.35
        run: |
          docker run --rm -v "$PWD:/w" -w /w/native ubuntu:22.04 bash -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq curl ca-certificates build-essential pkg-config \
              libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libx11-dev >/dev/null
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal >/dev/null
            . "$HOME/.cargo/env"
            cargo build --release'
          sudo chown -R "$(id -u):$(id -g)" native/target
          install -m 755 native/target/release/s700-host s700-host-linux-x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: s700-host-linux-x86_64

  windows:
    # WebView2 no enlaza con mingw. El runtime sí viene de serie en Windows 10/11
    # (es Edge), así que el usuario no instala nada.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Windows x86_64 - WebView2 (MSVC)
        run: cargo build --release --manifest-path native/Cargo.toml

      - name: Rename
        shell: bash {0}
        run: cp native/target/release/s700-host.exe s700-host-windows-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: s700-host-windows-x86_64.exe

  appimage:
    # Un solo fichero para Linux: lleva dentro WebKitGTK, sus procesos auxiliares
    # y las librerías que linuxdeploy deja fuera. Se construye en un contenedor
    # Ubuntu 22.04 igual que el binario suelto.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: AppImage x86_64
        run: ./native/build-appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/S700-configurator-x86_64.AppImage

  extras:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Single-file configurator
        run: |
          make build
          cp dist/S700-configurator.html S700-configurator.html
          cp dist/S700-configurator-eva.html S700-configurator-eva.html

      - name: Tests
        run: make test

      - uses: actions/upload-artifact@v4
        with:
          name: extras
          path: |
            S700-configurator.html
            S700-configurator-eva.html
            native/99-s700-hid.rules

  release:
    needs: [linux, appimage, windows, extras]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the files
        run: |
          find artifacts -type f -exec cp {} . \;
          ls -la S700-configurator.html S700-configurator-eva.html 99-s700-hid.rules s700-host-linux-x86_64 s700-host-windows-x86_64.exe S700-configurator-x86_64.AppImage

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          # action-gh-release v2 does NOT fall back to the annotated tag's message, so
          # without this every release published since v0.4.0 came out with an empty body.
          body: |
            Configurator for the HXSJ S700 «G6» gaming mouse — download, run, done. Nothing to install.

            * `s700-host-windows-x86_64.exe` — Windows 10/11: double click and that is it. It opens its
              own window (no tabs, no address bar) with the interface loaded and talks to the mouse
              itself: no permissions to grant and nothing to configure.
            * `s700-host-linux-x86_64` — Linux x86_64: run it, same window. If it cannot open the mouse
              (the kernel node is root-only) the *Debug* tab offers **Install udev rule**, or run it
              with `--install-rule`: your desktop asks for the password once, then everything runs as
              your normal user. No `cp`, no root server.
            * `S700-configurator-x86_64.AppImage` — Linux without WebKitGTK installed: one file,
              `chmod +x` and run; it carries the toolkit inside.
            * `S700-configurator.html` — one file, if you would rather not run anything: open it in
              Chrome/Edge/Brave and press *Connect mouse* (WebHID).
            * `S700-configurator-eva.html` — the same configurator with the alternative ORIEL skin.
              *Debug → Theme* switches skin there and inside every binary above.
            * `99-s700-hid.rules` — the `/dev/hidraw*` permission rule for Linux.

            Or use the published version: <https://jo3l.github.io/s700-mouse-configurator/>
            (the other skin: <https://jo3l.github.io/s700-mouse-configurator/eva/>)

            Back up from the *Backup* tab before writing anything to the mouse.
          files: |
            s700-host-linux-x86_64
            s700-host-windows-x86_64.exe
            S700-configurator-x86_64.AppImage
            S700-configurator.html
            S700-configurator-eva.html
            99-s700-hid.rules
