name: pages

# El configurador servido tal cual: la página de GitHub Pages ES la herramienta
# (https://jo3l.github.io/s700-mouse-configurator/). https es contexto seguro, así
# que WebHID funciona sin servir nada en local.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "tools/build.py"
      - "Makefile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Bundle the single-file configurator
        run: |
          make build
          mkdir -p public
          cp dist/S700-configurator.html public/index.html
          touch public/.nojekyll
          ls -la public

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true      # si Pages aún no está activado, lo activa

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
