[package]
name = "s700-host"
version = "0.1.0"
edition = "2021"
description = "Host nativo del configurador S700: sirve la UI y habla el HID del ratón sin permisos de navegador"
publish = false

[[bin]]
name = "s700-host"
path = "src/main.rs"

# El HID va a pelo (hidraw en Linux, hid.dll en Windows); lo único de fuera es
# el motor de la ventana: wry sobre tao (WebView2 en Windows, WebKitGTK en Linux).
# En Linux hace falta libwebkit2gtk-4.1-dev y libgtk-3-dev para compilar, y
# libwebkit2gtk-4.1-0 + libgtk-3-0 para ejecutar.
[dependencies]
wry = "0.57"
tao = "0.37"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
